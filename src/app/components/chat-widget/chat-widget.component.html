<!-- 浮動圓形聊天按鈕 -->
<div class="chat-widget-fab" (click)="toggleChat()" *ngIf="!isChatOpen">
  <span class="material-icons">chat</span>
</div>

<!-- 展開的聊天對話框 -->
<div class="chat-widget-box" *ngIf="isChatOpen">
  <div class="chat-widget-header">
    ISLE Support
    <span class="material-icons close-btn" (click)="toggleChat()">close</span>
  </div>
  <div class="chat-widget-messages">
    <div class="chat-message">您好！有什麼需要協助的嗎？</div>
    <div class="quick-questions">
      <div class="quick-question-label">常見問題：</div>
      <button 
        *ngFor="let question of quickQuestions" 
        class="quick-question-btn"
        [class.selected]="selectedQuestion === question"
        (click)="selectQuestion(question)"
        [disabled]="sending">
        {{ question }}
      </button>
    </div>
    <div class="chat-message">我們已收到您的來信！</div>
  </div>
  <div class="chat-widget-input">
    <input type="text" placeholder="請輸入訊息..." [(ngModel)]="message" [disabled]="sending || !selectedQuestion">
    <button (click)="send()" [disabled]="!message.trim() || sending">{{ sending ? '寄送中…' : '送出' }}</button>
  </div>
</div>
